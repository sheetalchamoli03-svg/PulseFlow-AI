<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseFlow AI - CRM to Project Delivery Automation Engine</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563EB'><path d='M13 2L3 14h9l-1 8 10-12h-9l1-8z'/></svg>" />
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#0f172a',
            }
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --navy: #0B132B;
      --navy-light: #1C2541;
      --blue: #2563EB;
      --blue-hover: #1D4ED8;
      --accent: #38BDF8;
      --gold: #D97706;
      --bg: #F8FAFC;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: #0F172A;
      font-family: "Plus Jakarta Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Modern glassmorphism & cards */
    .glass-header {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .card-hover {
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .card-hover:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px -10px rgba(15, 23, 42, 0.12);
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #F1F5F9;
    }
    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94A3B8;
    }

    .status-pulse {
      animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse-ring {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.15); }
    }
  </style>
</head>

<body class="selection:bg-blue-100 selection:text-blue-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // SVG Icons
    const Icons = {
      Bolt: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
      ),
      Check: () => (
        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M5 13l4 4L19 7" />
        </svg>
      ),
      Clock: () => (
        <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      ),
      Plus: () => (
        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4" />
        </svg>
      ),
      Refresh: () => (
        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
      ),
      Trash: () => (
        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
      ),
      ArrowRight: () => (
        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
        </svg>
      ),
      Search: () => (
        <svg className="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      ),
      User: () => (
        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
      ),
      Briefcase: () => (
        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
        </svg>
      ),
      Sparkles: () => (
        <svg className="w-4 h-4 text-amber-500" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8L12 2z" />
        </svg>
      ),
      CheckCircle: () => (
        <svg className="w-4 h-4 text-emerald-500" fill="currentColor" viewBox="0 0 20 20">
          <path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clipRule="evenodd" />
        </svg>
      )
    };

    function App() {
      const [activeTab, setActiveTab] = useState('pipeline');
      const [deals, setDeals] = useState([]);
      const [projects, setProjects] = useState([]);
      const [team, setTeam] = useState([]);
      const [stats, setStats] = useState(null);
      const [backendConnected, setBackendConnected] = useState(false);
      const [loading, setLoading] = useState(true);

      // Search & Filters
      const [dealSearch, setDealSearch] = useState('');
      const [dealStatusFilter, setDealStatusFilter] = useState('ALL');
      const [projectFilter, setProjectFilter] = useState('ALL');

      // Modals
      const [newDealModal, setNewDealModal] = useState(false);
      const [convertModal, setConvertModal] = useState(null); // deal object
      const [saving, setSaving] = useState(false);

      // Toast Notifications
      const [toasts, setToasts] = useState([]);

      const addToast = (message, type = 'success') => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => {
          setToasts(prev => prev.filter(t => t.id !== id));
        }, 4000);
      };

      // Deal Form State
      const [dealForm, setDealForm] = useState({
        client: '',
        deal_name: '',
        value: '₹5,00,000',
        scope: '',
        committed_date: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
        priority: 'High',
        notes: '',
        account_owner: 'Sheetal',
        project_manager: 'Admin',
        status: 'PROPOSAL'
      });

      // Fetch all data
      const loadAllData = async () => {
        try {
          const [dealsRes, projectsRes, teamRes, statsRes] = await Promise.all([
            fetch('/api/deals'),
            fetch('/api/projects'),
            fetch('/api/team'),
            fetch('/api/stats')
          ]);

          if (!dealsRes.ok) throw new Error('API deals error');

          const dealsData = await dealsRes.json();
          const projectsData = await projectsRes.json();
          const teamData = await teamRes.json();
          const statsData = await statsRes.json();

          setDeals(Array.isArray(dealsData) ? dealsData : []);
          setProjects(Array.isArray(projectsData) ? projectsData : []);
          setTeam(Array.isArray(teamData) ? teamData : []);
          setStats(statsData);
          setBackendConnected(true);
        } catch (err) {
          console.warn('Backend connection failed:', err);
          setBackendConnected(false);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        loadAllData();
      }, []);

      // Format currency
      const formatCurrency = (val) => {
        if (!val) return '₹0';
        if (typeof val === 'string' && val.includes('₹')) return val;
        const num = Number(val);
        if (isNaN(num)) return val;
        return '₹' + num.toLocaleString('en-IN');
      };

      // Create New Deal
      const handleCreateDeal = async (e) => {
        e.preventDefault();
        setSaving(true);
        try {
          const res = await fetch('/api/deals', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(dealForm)
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Failed to save deal');

          addToast('Deal created successfully!');
          setNewDealModal(false);
          setDealForm({
            client: '',
            deal_name: '',
            value: '₹5,00,000',
            scope: '',
            committed_date: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
            priority: 'High',
            notes: '',
            account_owner: 'Sheetal',
            project_manager: 'Admin',
            status: 'PROPOSAL'
          });
          loadAllData();
        } catch (err) {
          addToast(err.message, 'error');
        } finally {
          setSaving(false);
        }
      };

      // Update Deal Status
      const handleUpdateDealStatus = async (dealId, newStatus) => {
        try {
          const res = await fetch(`/api/deals/${dealId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: newStatus })
          });
          if (!res.ok) throw new Error('Failed to update status');
          addToast(`Deal status updated to ${newStatus}`);
          loadAllData();
        } catch (err) {
          addToast(err.message, 'error');
        }
      };

      // Delete Deal
      const handleDeleteDeal = async (dealId) => {
        if (!window.confirm('Are you sure you want to delete this deal?')) return;
        try {
          const res = await fetch(`/api/deals/${dealId}`, { method: 'DELETE' });
          if (!res.ok) throw new Error('Failed to delete deal');
          addToast('Deal removed successfully.');
          loadAllData();
        } catch (err) {
          addToast(err.message, 'error');
        }
      };

      // Convert Deal to Delivery Project
      const handleConvertDeal = async (deal, assignedDev) => {
        setSaving(true);
        try {
          const res = await fetch('/api/convert-deal', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              deal_id: deal.deal_id,
              client: deal.client,
              deal_name: deal.deal_name,
              scope: deal.scope,
              assigned_to: assignedDev
            })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Failed to convert deal');

          addToast(`Success! Converted to ${data.project_id} assigned to ${data.assigned_to}`);
          setConvertModal(null);
          loadAllData();
          setActiveTab('projects');
        } catch (err) {
          addToast(err.message, 'error');
        } finally {
          setSaving(false);
        }
      };

      // Update Project Progress
      const handleUpdateProjectProgress = async (projectId, progress) => {
        try {
          const res = await fetch(`/api/projects/${projectId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ progress })
          });
          if (!res.ok) throw new Error('Failed to update progress');
          setProjects(prev => prev.map(p => p.project_id === projectId ? { ...p, progress } : p));
        } catch (err) {
          addToast(err.message, 'error');
        }
      };

      // Update Project Delivery Status
      const handleUpdateProjectStatus = async (projectId, delivery_status) => {
        try {
          const res = await fetch(`/api/projects/${projectId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ delivery_status })
          });
          if (!res.ok) throw new Error('Failed to update project status');
          addToast(`Project marked as ${delivery_status.replace('_', ' ')}`);
          loadAllData();
        } catch (err) {
          addToast(err.message, 'error');
        }
      };

      // Delete Project
      const handleDeleteProject = async (projectId) => {
        if (!window.confirm('Are you sure you want to delete this project?')) return;
        try {
          const res = await fetch(`/api/projects/${projectId}`, { method: 'DELETE' });
          if (!res.ok) throw new Error('Failed to delete project');
          addToast('Project deleted successfully.');
          loadAllData();
        } catch (err) {
          addToast(err.message, 'error');
        }
      };

      // Toggle Milestone Status
      const handleToggleMilestone = async (milestoneId, currentStatus) => {
        const nextStatus = currentStatus === 'COMPLETED' ? 'PENDING' : 'COMPLETED';
        try {
          const res = await fetch(`/api/milestones/${milestoneId}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: nextStatus })
          });
          if (!res.ok) throw new Error('Failed to update milestone');
          loadAllData();
        } catch (err) {
          addToast(err.message, 'error');
        }
      };

      // Filtered deals
      const filteredDeals = useMemo(() => {
        return deals.filter(d => {
          const matchesSearch =
            (d.deal_name || '').toLowerCase().includes(dealSearch.toLowerCase()) ||
            (d.client || '').toLowerCase().includes(dealSearch.toLowerCase()) ||
            (d.scope || '').toLowerCase().includes(dealSearch.toLowerCase());
          const matchesStatus =
            dealStatusFilter === 'ALL' ||
            (d.status || '').toUpperCase() === dealStatusFilter.toUpperCase();
          return matchesSearch && matchesStatus;
        });
      }, [deals, dealSearch, dealStatusFilter]);

      // Filtered projects
      const filteredProjects = useMemo(() => {
        return projects.filter(p => {
          if (projectFilter === 'ALL') return true;
          return (p.delivery_status || '').toUpperCase() === projectFilter.toUpperCase();
        });
      }, [projects, projectFilter]);

      // AI Match recommendation preview helper
      const getAIRecommendation = (scope = '', name = '') => {
        const text = `${scope} ${name}`.toLowerCase();
        if (text.includes('qa') || text.includes('test') || text.includes('security')) {
          return { dev: 'Priya Sharma (QA Engineer)', reason: 'Scope emphasizes QA, security verification and testing.' };
        }
        if (text.includes('devops') || text.includes('docker') || text.includes('cloud') || text.includes('ci/cd')) {
          return { dev: 'Marcus Brody (DevOps Engineer)', reason: 'Scope focuses on infrastructure, CI/CD, and cloud orchestration.' };
        }
        if (text.includes('ui') || text.includes('frontend') || text.includes('react') || text.includes('design') || text.includes('css')) {
          return { dev: 'Liam Chen (Frontend Specialist)', reason: 'Matches high UI/UX fidelity and modern frontend responsive design.' };
        }
        if (text.includes('backend') || text.includes('api') || text.includes('database') || text.includes('sql') || text.includes('server')) {
          return { dev: 'Alex Morgan (Backend Engineer)', reason: 'High match with database design, backend services and API contracts.' };
        }
        return { dev: 'Maya Lin (Full Stack Developer)', reason: 'Broad scope requiring full-stack agility across client & server architecture.' };
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 text-slate-900 font-sans">
          
          {/* Top Sticky Header */}
          <header className="sticky top-0 z-40 glass-header border-b border-slate-200/80 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              
              {/* Brand Logo & DB status */}
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-700 to-indigo-600 flex items-center justify-center text-white shadow-md shadow-blue-500/20 font-black text-lg">
                  ⚡
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-extrabold text-lg text-slate-900 tracking-tight">PulseFlow AI</span>
                    <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-blue-100 text-blue-800 uppercase tracking-wider">v2.0</span>
                  </div>
                  <div className="flex items-center gap-1.5 text-xs font-semibold text-slate-500">
                    <span className={`w-2 h-2 rounded-full ${backendConnected ? 'bg-emerald-500 status-pulse' : 'bg-rose-500'}`}></span>
                    <span>{backendConnected ? 'SQLite Live · Port 5000' : 'Backend Offline'}</span>
                  </div>
                </div>
              </div>

              {/* Navigation Tabs */}
              <nav className="hidden md:flex items-center gap-1 bg-slate-100/90 p-1.5 rounded-2xl border border-slate-200/90 text-sm font-semibold">
                {[
                  { id: 'pipeline', label: 'CRM Pipeline', count: deals.length },
                  { id: 'projects', label: 'Delivery Records', count: projects.length },
                  { id: 'team', label: 'Team & AI Engine', count: team.length }
                ].map(t => (
                  <button
                    key={t.id}
                    onClick={() => setActiveTab(t.id)}
                    className={`flex items-center gap-2 px-3.5 py-1.5 rounded-xl transition-all ${
                      activeTab === t.id
                        ? 'bg-slate-900 text-white shadow-sm'
                        : 'text-slate-600 hover:text-slate-900 hover:bg-slate-200/70'
                    }`}
                  >
                    <span>{t.label}</span>
                    <span className={`text-[11px] px-1.5 py-0.2 rounded-full font-bold ${
                      activeTab === t.id ? 'bg-slate-800 text-slate-200' : 'bg-slate-200 text-slate-600'
                    }`}>
                      {t.count}
                    </span>
                  </button>
                ))}
              </nav>

              {/* Header Right Actions */}
              <div className="flex items-center gap-2">
                <button
                  onClick={loadAllData}
                  title="Refresh Data"
                  className="p-2 text-slate-500 hover:text-slate-800 bg-white border border-slate-200 rounded-xl hover:bg-slate-50 transition"
                >
                  <Icons.Refresh />
                </button>
                <button
                  onClick={() => setNewDealModal(true)}
                  className="flex items-center gap-1.5 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl font-bold text-sm shadow-md shadow-blue-500/20 transition-all active:scale-95"
                >
                  <Icons.Plus />
                  <span>New Sales Deal</span>
                </button>
              </div>
            </div>

            {/* Mobile Navigation bar */}
            <div className="md:hidden flex border-t border-slate-200 bg-white px-3 py-2 gap-2 overflow-x-auto text-xs font-semibold">
              {[
                { id: 'pipeline', label: 'CRM Deals' },
                { id: 'projects', label: 'Delivery Projects' },
                { id: 'team', label: 'Team Capacity' }
              ].map(t => (
                <button
                  key={t.id}
                  onClick={() => setActiveTab(t.id)}
                  className={`px-3 py-1.5 rounded-lg whitespace-nowrap ${
                    activeTab === t.id ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-700'
                  }`}
                >
                  {t.label}
                </button>
              ))}
            </div>
          </header>

          {/* Main Content Area */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
            
            {/* Top KPI Metric Ribbon */}
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
              <div className="bg-white p-5 rounded-2xl border border-slate-200/90 shadow-sm">
                <p className="text-xs font-bold text-slate-500 uppercase tracking-wider">Total Pipeline Value</p>
                <p className="text-2xl font-black text-slate-900 mt-1">
                  {stats ? formatCurrency(stats.pipeline_value) : '₹0'}
                </p>
                <div className="flex items-center gap-1.5 mt-2 text-xs font-semibold text-slate-500">
                  <span className="text-blue-600 font-bold">{deals.length}</span> Active Deals in CRM
                </div>
              </div>

              <div className="bg-white p-5 rounded-2xl border border-slate-200/90 shadow-sm">
                <p className="text-xs font-bold text-emerald-600 uppercase tracking-wider">Won Revenue Closed</p>
                <p className="text-2xl font-black text-emerald-700 mt-1">
                  {stats ? formatCurrency(stats.won_value) : '₹0'}
                </p>
                <div className="flex items-center gap-1.5 mt-2 text-xs font-semibold text-emerald-600">
                  <Icons.CheckCircle />
                  <span>Win Rate: {stats?.win_rate || 0}%</span>
                </div>
              </div>

              <div className="bg-white p-5 rounded-2xl border border-slate-200/90 shadow-sm">
                <p className="text-xs font-bold text-blue-600 uppercase tracking-wider">Engineering Delivery</p>
                <p className="text-2xl font-black text-slate-900 mt-1">
                  {projects.length} <span className="text-sm font-medium text-slate-400">Projects</span>
                </p>
                <div className="flex items-center gap-1.5 mt-2 text-xs font-semibold text-blue-600">
                  <span>{projects.filter(p => p.delivery_status !== 'COMPLETED').length} in active development</span>
                </div>
              </div>

              <div className="bg-white p-5 rounded-2xl border border-slate-200/90 shadow-sm">
                <p className="text-xs font-bold text-amber-600 uppercase tracking-wider">AI Skill Match Engine</p>
                <p className="text-2xl font-black text-slate-900 mt-1 flex items-center gap-1.5">
                  100% <Icons.Sparkles />
                </p>
                <div className="flex items-center gap-1.5 mt-2 text-xs font-semibold text-slate-500">
                  <span>{team.length} Engineers Auto-Dispatched</span>
                </div>
              </div>

                      type="submit"
                      disabled={saving}
                      className="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-xl text-sm font-bold shadow-md shadow-blue-500/20 transition active:scale-95 disabled:opacity-50"
                    >
                      {saving ? 'Saving...' : 'Create Sales Deal'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: AI Convert Deal to Project Preview */}
          {convertModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-200 space-y-5 animate-in fade-in duration-200">
                <div className="flex justify-between items-center pb-2 border-b border-slate-100">
                  <div className="flex items-center gap-2">
                    <span className="p-2 rounded-xl bg-amber-100 text-amber-700 font-bold">
                      <Icons.Sparkles />
                    </span>
                    <div>
                      <h3 className="text-lg font-black text-slate-900 tracking-tight">AI Deal-to-Project Conversion</h3>
                      <p className="text-xs text-slate-500 font-medium">Automatic engineering assignment & milestone generation.</p>
                    </div>
                  </div>
                  <button
                    onClick={() => setConvertModal(null)}
                    className="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center font-bold text-sm"
                  >
                    ✕
                  </button>
                </div>

                <div className="space-y-4">
                  <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-2">
                    <div className="flex justify-between items-start">
                      <div>
                        <h4 className="font-bold text-slate-900">{convertModal.deal_name}</h4>
                        <p className="text-xs font-semibold text-blue-600">{convertModal.client} · {convertModal.value}</p>
                      </div>
                      <span className="font-mono text-xs font-bold px-2 py-0.5 rounded bg-slate-200 text-slate-700">
                        {convertModal.deal_id}
                      </span>
                    </div>
                    <p className="text-xs text-slate-600 italic bg-white p-2.5 rounded-xl border border-slate-100">
                      "{convertModal.scope}"
                    </p>
                  </div>

                  {/* AI Recommendation Card */}
                  {(() => {
                    const recommendation = getAIRecommendation(convertModal.scope, convertModal.deal_name);
                    return (
                      <div className="p-4 rounded-2xl bg-gradient-to-br from-blue-50 to-indigo-50 border border-blue-200/80 space-y-2">
                        <div className="flex items-center gap-2">
                          <span className="text-xs font-extrabold uppercase tracking-wider text-blue-700 flex items-center gap-1">
                            <Icons.Sparkles /> AI Skill Match Recommendation
                          </span>
                        </div>
                        <p className="text-sm font-black text-slate-900">
                          {recommendation.dev}
                        </p>
                        <p className="text-xs text-slate-600">
                          {recommendation.reason}
                        </p>
                      </div>
                    );
                  })()}

                  {/* Generated Milestones preview */}
                  <div className="space-y-1.5">
                    <span className="text-xs font-bold text-slate-700 block">Deliverables Generated:</span>
                    <div className="text-xs space-y-1 text-slate-600">
                      <div className="flex items-center gap-2 p-2 rounded-lg bg-slate-50">
                        <Icons.CheckCircle />
                        <span>Milestone 1: Architecture Blueprint & Tech Specs (25%)</span>
                      </div>
                      <div className="flex items-center gap-2 p-2 rounded-lg bg-slate-50">
                        <Icons.Clock />
                        <span>Milestone 2: Core Feature Implementation & APIs (50%)</span>
                      </div>
                      <div className="flex items-center gap-2 p-2 rounded-lg bg-slate-50">
                        <Icons.Clock />
                        <span>Milestone 3: QA Verification & Cloud Release (25%)</span>
                      </div>
                    </div>
                  </div>

                  <div className="flex justify-end gap-2 pt-3 border-t border-slate-100">
                    <button
                      type="button"
                      onClick={() => setConvertModal(null)}
                      className="px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition"
                    >
                      Cancel
                    </button>
                    <button
                      type="button"
                      disabled={saving}
                      onClick={() => {
                        const rec = getAIRecommendation(convertModal.scope, convertModal.deal_name);
                        handleConvertDeal(convertModal, rec.dev);
                      }}
                      className="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-xl text-sm font-bold shadow-md shadow-blue-500/20 transition active:scale-95 disabled:opacity-50 flex items-center gap-1.5"
                    >
                      <Icons.Sparkles />
                      <span>{saving ? 'Converting...' : 'Confirm & Launch Project'}</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Toast Notification Container */}
          <div className="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm pointer-events-none">
            {toasts.map(t => (
              <div
                key={t.id}
                className={`pointer-events-auto flex items-center gap-2 px-4 py-3 rounded-2xl shadow-xl text-xs font-bold text-white transition-all transform animate-in slide-in-from-bottom-5 ${
                  t.type === 'error' ? 'bg-rose-600' : 'bg-slate-900'
                }`}
              >
                <span>{t.type === 'error' ? '🛑' : '✨'}</span>
                <span>{t.message}</span>
              </div>
            ))}
          </div>

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>

</html>
